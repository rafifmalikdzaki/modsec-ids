[project]
name = "modsec-ids"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastplotlib>=0.6.1",
  "matplotlib>=3.10.7",
  "numpy>=2.3.5",
  "openpyxl>=3.1.5",
  "pandas>=2.3.3",
  "pytorch-frame>=0.3.0",
  "pyzmq>=27.1.0",
  "rich>=14.2.0",
  "scikit-learn>=1.7.2",
  "seaborn>=0.13.2",
  "textual>=6.6.0",
  "torch",
  "torchvision",
  "tensorflow>=2.15.0",
  "tokenizers>=0.22.1",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
